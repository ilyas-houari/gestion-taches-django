{% extends 'tasks/base.html' %}

{% block content %}

<div class="mx-auto" style="max-width:500px;">

    <div class="text-center mb-4">

        <h2 class="fw-bold">
            Créer un compte
        </h2>

        <p class="text-muted">
            Créez votre espace pour organiser vos tâches.
        </p>

    </div>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn btn-primary w-100 mt-2">
            Créer mon compte
        </button>

    </form>

    <div class="text-center mt-4">

        <span class="text-muted">
            Vous avez déjà un compte ?
        </span>

        <a href="{% url 'login' %}">
            Se connecter
        </a>

    </div>

</div>

{% endblock %}
